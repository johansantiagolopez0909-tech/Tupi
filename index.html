<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111827"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>TUPI — Aventura 2D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1220;font-family:system-ui,Arial;color:#fff;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}#game{display:block;width:100vw;height:100vh;background:#101a30}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-weight:800;text-shadow:0 2px 5px #000;font-size:15px}.pill{background:#101827bb;border:1px solid #ffffff33;border-radius:14px;padding:8px 12px}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#07101dcc;text-align:center;padding:24px}#panel{max-width:360px;background:#17243bea;border:1px solid #ffffff35;border-radius:24px;padding:26px;box-shadow:0 20px 70px #0009}h1{font-size:48px;letter-spacing:5px;margin:0;color:#7de8ff;text-shadow:0 4px 0 #17627a}p{color:#d6e4f4;line-height:1.5}button{border:0;border-radius:15px;padding:13px 24px;background:#38c8e8;color:#06202b;font-weight:900;font-size:17px}#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;pointer-events:none}.cluster{display:flex;gap:12px}.ctrl{pointer-events:auto;width:66px;height:66px;border-radius:50%;background:#ffffff25;border:2px solid #ffffff88;color:white;font-size:27px;font-weight:900;backdrop-filter:blur(5px);user-select:none}.ctrl:active{background:#55d9f0aa}#hint{position:fixed;bottom:96px;left:0;right:0;text-align:center;color:#ffffff99;font-size:12px;pointer-events:none}
</style></head><body><canvas id="game"></canvas><div id="hud"><div class="pill">⭐ <span id="coins">0</span></div><div class="pill">❤️ <span id="lives">3</span></div><div class="pill">NIVEL 1</div></div><div id="hint">Mantén ◀ ▶ para moverte · ▲ para saltar</div><div id="controls"><div class="cluster"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><button class="ctrl" id="jump">▲</button></div><div id="overlay"><div id="panel"><h1>TUPI</h1><p>¡Aventura 2D! Salta entre plataformas, recoge estrellas y evita a los monstruos.</p><button id="start">JUGAR</button></div></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,scale=1;function resize(){scale=Math.max(1,Math.min(2,devicePixelRatio||1));W=innerWidth;H=innerHeight;c.width=Math.floor(W*scale);c.height=Math.floor(H*scale);ctx.setTransform(scale,0,0,scale,0,0)}addEventListener('resize',resize);addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});resize();
let running=false,cam=0,coins=0,lives=3,keys={left:false,right:false},player,platforms,stars,enemies,last=0;
function reset(){cam=0;coins=0;lives=3;player={x:55,y:H-170,w:34,h:46,vx:0,vy:0,on:false,inv:0};platforms=[{x:0,y:H-70,w:480,h:90},{x:540,y:H-145,w:180,h:22},{x:790,y:H-215,w:180,h:22},{x:1050,y:H-140,w:210,h:22},{x:1340,y:H-205,w:190,h:22},{x:1620,y:H-115,w:300,h:22},{x:2010,y:H-185,w:220,h:22},{x:2320,y:H-100,w:500,h:90}];stars=[590,650,840,900,1110,1170,1400,1460,1700,1780,2080,2160,2450].map((x,i)=>({x,y:(i%3===0?H-190:i%3===1?H-255:H-150),got:false}));enemies=[{x:650,y:H-181,v:1.1,min:550,max:700},{x:1130,y:H-176,v:1.3,min:1060,max:1240},{x:1740,y:H-151,v:1.5,min:1640,max:1880},{x:2110,y:H-221,v:1.2,min:2020,max:2190}];ui()}
function ui(){document.getElementById('coins').textContent=coins;document.getElementById('lives').textContent=lives}
function bind(id,k){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,()=>keys[k]=false))}bind('left','left');bind('right','right');let jumpHeld=false;let jb=document.getElementById('jump');jb.addEventListener('pointerdown',e=>{e.preventDefault();jumpHeld=true;jb.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(t=>jb.addEventListener(t,()=>jumpHeld=false));addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key===' '||e.key==='ArrowUp'||e.key==='w')jumpHeld=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.key===' '||e.key==='ArrowUp'||e.key==='w')jumpHeld=false});
document.getElementById('start').onclick=()=>{reset();running=true;document.getElementById('overlay').style.display='none'};
function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h)}function draw(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#14264a');g.addColorStop(1,'#426b82');ctx.fillStyle=g;ctx.fillRect(0,0,W,H); // moon and stars
ctx.fillStyle='#d7f5ff';ctx.beginPath();ctx.arc(W-75,85,28,0,7);ctx.fill();for(let i=0;i<45;i++){let x=(i*137)%W,y=(i*71)%Math.max(120,H*.55);ctx.globalAlpha=.35+(i%4)*.15;ctx.fillRect(x,y,2,2)}ctx.globalAlpha=1;
// distant hills
for(let i=0;i<7;i++){let x=((i*270-cam*.25)%(W+300))-100;ctx.fillStyle='#203d52';ctx.beginPath();ctx.moveTo(x,H-70);ctx.quadraticCurveTo(x+110,H-260-(i%2)*35,x+260,H-70);ctx.fill()}
for(let p of platforms){let x=p.x-cam;if(x+p.w<0||x>W)continue;rect(x,p.y,p.w,p.h,'#243b3b');rect(x,p.y,p.w,8,'#65d18c');for(let j=0;j<p.w;j+=28)rect(x+j,p.y+13,14,4,'#34584a')}
for(let s of stars)if(!s.got){let x=s.x-cam;ctx.fillStyle='#ffe66d';ctx.beginPath();for(let i=0;i<10;i++){let r=i%2?5:11,a=-Math.PI/2+i*Math.PI/5;ctx.lineTo(x+Math.cos(a)*r,s.y+Math.sin(a)*r)}ctx.closePath();ctx.fill()}
for(let e of enemies){let x=e.x-cam;ctx.fillStyle='#9b75df';ctx.beginPath();ctx.arc(x,e.y,17,0,7);ctx.fill();ctx.fillStyle='white';ctx.fillRect(x-8,e.y-5,5,7);ctx.fillRect(x+4,e.y-5,5,7);ctx.fillStyle='#24143b';ctx.fillRect(x-6,e.y-3,2,4);ctx.fillRect(x+6,e.y-3,2,4)}
// Tupi character
let x=player.x-cam,y=player.y;ctx.fillStyle=player.inv>0?'#ffffff88':'#ffbd59';ctx.fillRect(x+4,y+12,26,30);ctx.fillStyle='#ffdf9b';ctx.beginPath();ctx.arc(x+17,y+12,15,0,7);ctx.fill();ctx.fillStyle='#17243b';ctx.fillRect(x+10,y+9,4,5);ctx.fillRect(x+21,y+9,4,5);ctx.fillStyle='#e96d54';ctx.fillRect(x+9,y+27,18,5);ctx.fillStyle='#23334d';ctx.fillRect(x+3,y+40,12,6);ctx.fillRect(x+20,y+40,12,6);ctx.fillStyle='#7de8ff';ctx.fillRect(x+8,y+1,19,5);
}
function update(dt){let p=player;p.vx=(keys.right?3.6:0)-(keys.left?3.6:0);p.x+=p.vx*dt/16.7;p.vy+=.55*dt/16.7;p.y+=p.vy*dt/16.7;p.on=false;for(let a of platforms){if(p.x+p.w>a.x&&p.x<a.x+a.w&&p.y+p.h>a.y&&p.y+p.h<a.y+18&&p.vy>=0){p.y=a.y-p.h;p.vy=0;p.on=true}}if(jumpHeld&&p.on){p.vy=-11.5;p.on=false}if(p.inv>0)p.inv-=dt;
for(let s of stars)if(!s.got&&Math.abs((p.x+p.w/2)-s.x)<25&&Math.abs((p.y+p.h/2)-s.y)<30){s.got=true;coins++;ui()}
for(let e of enemies){e.x+=e.v*dt/16.7;if(e.x<e.min||e.x>e.max)e.v*=-1;if(p.inv<=0&&Math.abs((p.x+p.w/2)-e.x)<28&&Math.abs((p.y+p.h/2)-e.y)<30){lives--;p.inv=1300;p.vy=-6;ui();if(lives<=0)end('¡FIN DEL JUEGO!','Recogiste '+coins+' estrellas. ¡Inténtalo otra vez!')}}
if(p.y>H+80){lives--;ui();p.x=55;p.y=H-170;p.vy=0;if(lives<=0)end('¡FIN DEL JUEGO!','Recogiste '+coins+' estrellas. ¡Inténtalo otra vez!')}
cam=Math.max(0,Math.min(2200,p.x-W*.32));if(p.x>2380)end('¡NIVEL COMPLETADO!','¡Genial! Recogiste '+coins+' estrellas.');}
function end(title,msg){running=false;document.querySelector('#panel h1').textContent=title;document.querySelector('#panel p').textContent=msg;document.getElementById('start').textContent='VOLVER A JUGAR';document.getElementById('overlay').style.display='grid'}function loop(t){let dt=Math.min(32,t-last||16);last=t;if(running)update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
